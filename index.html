<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Calculadora Oferta Distribuidora</title>
<style>
  :root{
    --azul:#07166F;
    --vermelho:#9a0808;
    --fundo:#fff;
  }
  body{
    margin:0;
    font-family: Arial, sans-serif;
    background:var(--fundo);
  }
  header{
    background:var(--azul);
    color:#fff;
    padding:12px 16px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    border-bottom:4px solid var(--vermelho);
  }
  header img{
    height:34px;
  }
  header h1{
    font-size:15px;
    margin:0;
    font-weight:700;
    flex:1;
    text-align:center;
  }
  #closeBtn{
    background:transparent;
    border:none;
    color:#fff;
    font-size:20px;
    cursor:pointer;
  }
  iframe{
    width:100%;
    height:calc(100vh - 60px);
    border:none;
  }
</style>
</head>
<body>
  <header>
    <img src="https://i.ibb.co/JRtdDbvg/logo-259284769-1731333548-3b7040c608bd446abf2016b904dcfdd71731333548-480-0.webp" alt="Logo Oferta Distribuidora">
    <h1>Calculadora Oferta Distribuidora</h1>
    <button id="closeBtn" onclick="window.parent.postMessage('closeCalculadoraOferta','*')">❌</button>
  </header>

  <iframe src="calculo mmn.html"></iframe>

</body>
</html>
